<!-- CONTACT FORM WITH SIDE IMAGE (STYLE) -->
<style>
    /* Floating Contact Form Section */
    .feedback-section {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
        margin-top: 40px;
    }

    /* Flexbox Container */
    .feedback-card {
        background: rgba(30, 41, 59, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 20px;
        padding: 35px;
        width: 100%;
        max-width: 950px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 
                    0 0 20px rgba(56, 189, 248, 0.15);
        
        /* Flexbox for Side-by-Side Layout */
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 35px;

        /* Floating Animation */
        animation: floatCard 6s ease-in-out infinite;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .feedback-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 22px 45px rgba(0, 0, 0, 0.6), 
                    0 0 30px rgba(56, 189, 248, 0.3);
    }

    @keyframes floatCard {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }

    /* Side Image Styling */
    .feedback-image-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    .feedback-image {
        width: 100%;
        max-width: 380px;
        height: 100%;
        max-height: 420px;
        object-fit: cover;
        border-radius: 15px;
        border: 1px solid rgba(56, 189, 248, 0.3);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    /* Form Container */
    .feedback-form-container {
        flex: 1.2;
        width: 100%;
    }

    .feedback-header { 
        text-align: left; 
        margin-bottom: 25px; 
    }
    
    .feedback-title { 
        color: #ffffff; 
        font-size: 1.8rem; 
        font-weight: 700; 
        margin-bottom: 8px; 
        margin-top: 0;
    }
    
    .feedback-subtitle { 
        color: #94a3b8; 
        font-size: 0.95rem; 
        margin: 0;
    }

    .feedback-form { 
        display: flex; 
        flex-direction: column; 
        gap: 16px; 
    }
    
    .form-group { 
        display: flex; 
        flex-direction: column; 
    }

    .form-input {
        width: 100%;
        padding: 12px 16px;
        background-color: rgba(15, 23, 42, 0.8);
        border: 1px solid #334155;
        border-radius: 10px;
        color: #ffffff;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.3s ease;
    }

    .form-input::placeholder { color: #64748b; }

    .form-input:focus {
        border-color: #38bdf8;
        background-color: rgba(15, 23, 42, 0.95);
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    textarea.form-input { 
        resize: vertical; 
        min-height: 110px; 
    }

    .submit-btn {
        background: linear-gradient(135deg, #0284c7, #0369a1);
        color: #ffffff;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        margin-top: 5px;
    }

    .submit-btn:hover {
        background: linear-gradient(135deg, #38bdf8, #0284c7);
        box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        transform: translateY(-2px);
    }

    /* Responsive for Mobile Devices */
    @media only screen and (max-width: 768px) {
        .feedback-card {
            flex-direction: column;
            padding: 25px 20px;
        }
        .feedback-header {
            text-align: center;
        }
        .feedback-image {
            max-height: 250px;
        }
    }
</style>

<!-- CONTACT FORM WITH SIDE IMAGE (HTML) -->
<section class="feedback-section">
    <div class="feedback-card">
        <!-- Side Image Container -->
        <div class="feedback-image-container">
            <img src="https://images.unsplash.com/photo-1534536281715-e28d76689b4d?q=80&w=800&auto=format&fit=crop" alt="Contact Us" class="feedback-image">
        </div>

        <!-- Form Container -->
        <div class="feedback-form-container">
            <div class="feedback-header">
                <h2 class="feedback-title">
                    අප වෙත අදහස් යොමු කරන්න 💬
                </h2>
                <p class="feedback-subtitle">
                    ඔබේ අදහස් හෝ ගැටලු කඩිනමින් අපගේ කණ්ඩායම වෙත යොමු කරන්න.
                </p>
            </div>

            <form class="feedback-form" id="contactForm">
                <div class="form-group">
                    <input type="text" class="form-input" placeholder="ඔබගේ නම (Name)" required />
                </div>

                <div class="form-group">
                    <input type="email" class="form-input" placeholder="විද්‍යුත් ලිපිනය (Email)" required />
                </div>

                <div class="form-group">
                    <input type="text" class="form-input" placeholder="විෂය (Subject)" required />
                </div>

                <div class="form-group">
                    <input type="tel" class="form-input" placeholder="දුරකථන අංකය (Phone Number)" />
                </div>

                <div class="form-group">
                    <textarea class="form-input" placeholder="පණිවිඩය (Message)" rows="4" required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    පණිවිඩය යවන්න 🚀
                </button>
            </form>
        </div>
    </div>
</section>
